name: group_insights
version: "1.0.0"
author: Videl
description: Read-only group policy simulator and live bot permission diagnostics
entry: plugin.py
enabled: true
min_bot_version: "3.0.0"
tags: [group, moderation, diagnostics]
permissions: [group_admin_verification]
commands:
  - name: policysim
    description: Preview active lock and keyword rules without enforcing them
    access: admin
  - name: ghealth
    description: Check the bot's live group administrator permissions
    access: admin
