name: game
version: "1.0.0"
author: Videl
description: Single-player arcade with a Telegram-button fallback and optional beta widgets
entry: plugin.py
enabled: true
min_bot_version: "3.0.0"
tags: [games, entertainment]
permissions: []
commands:
  - name: game
    description: Play a game in chat
    access: user
callbacks:
  - pattern: "^vga:[0-9]+:[XO-]{9}:[0-8r]$"
    description: Play the single-player chat game
    access: user
  - pattern: "^vgg:[a-zA-Z0-9:]+$"
    description: Browse and open widget games
    access: user
  - pattern: "^vgc:[a-zA-Z0-9:]+$"
    description: Play additional chat games
    access: user
