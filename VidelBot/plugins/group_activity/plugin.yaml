name: group_activity
version: "1.0.0"
author: Videl
description: Opt-in group message rankings, member totals and privacy controls
entry: plugin.py
enabled: true
min_bot_version: "3.0.0"
tags: [group, analytics, community]
permissions: [database, group_admin_verification]
commands:
  - name: activity
    description: Review or enable/disable group activity counting
    access: admin
  - name: topmembers
    description: Show all-time, today or last-seven-date message rankings
    access: user
  - name: myactivity
    description: Show recorded totals and your all-time rank
    access: user
  - name: memberactivity
    description: Show recorded activity for a replied-to member
    access: user
  - name: groupactivity
    description: Show recorded group activity totals
    access: user
  - name: activityprivacy
    description: Opt out of or back into group activity counting
    access: user
callbacks:
  - pattern: "^plg_act:board:[A-Za-z0-9_]+:[0-9]+$"
    description: Browse group activity leaderboard periods and pages
    access: user
