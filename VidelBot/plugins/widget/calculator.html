<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;padding:12px;font:14px system-ui,sans-serif;color:var(--tg-theme-text-color,#f4f6fb);background:transparent}.card{max-width:390px;margin:auto;padding:14px;border:1px solid var(--tg-theme-hint-color,#737c8b);border-radius:20px;background:var(--tg-theme-secondary-bg-color,#202632)}.head{display:flex;align-items:center;justify-content:space-between;margin:0 2px 12px}.brand{font-weight:750;letter-spacing:.01em}.badge{font-size:10px;padding:4px 7px;border-radius:99px;background:var(--tg-theme-button-color,#5088df);color:var(--tg-theme-button-text-color,#fff)}.screen{min-height:92px;padding:13px 15px;margin-bottom:10px;border-radius:14px;background:var(--tg-theme-bg-color,#151a22);text-align:right;display:flex;flex-direction:column;justify-content:center;overflow:hidden}.expr{font:13px ui-monospace,monospace;min-height:20px;opacity:.7;overflow-wrap:anywhere}.value{font-size:30px;font-weight:700;line-height:1.2;overflow-wrap:anywhere;font-variant-numeric:tabular-nums}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.key{min-height:47px;border:0;border-radius:12px;background:var(--tg-theme-bg-color,#151a22);color:var(--tg-theme-text-color,#f4f6fb);font:600 17px system-ui,sans-serif;touch-action:manipulation}.key.op{background:var(--tg-theme-secondary-bg-color,#303948)}.key.eq{background:var(--tg-theme-button-color,#5088df);color:var(--tg-theme-button-text-color,#fff)}.key:active{opacity:.72;transform:scale(.97)}.foot{min-height:18px;margin:9px 2px 0;font-size:10px;opacity:.7;text-align:center}@media(prefers-reduced-motion:reduce){.key{transition:none}}
</style></head><body><main class="card"><header class="head"><span class="brand">Videl Calculator</span><span class="badge">SHARED</span></header><section class="screen" aria-live="polite"><div class="expr" id="expr"></div><div class="value" id="value">0</div></section><section class="grid" id="keys" aria-label="Calculator keys"><button class="key op" data-key="C">AC</button><button class="key op" data-key="(">(</button><button class="key op" data-key=")">)</button><button class="key op" data-key="⌫">⌫</button><button class="key" data-key="7">7</button><button class="key" data-key="8">8</button><button class="key" data-key="9">9</button><button class="key op" data-key="/">÷</button><button class="key" data-key="4">4</button><button class="key" data-key="5">5</button><button class="key" data-key="6">6</button><button class="key op" data-key="*">×</button><button class="key" data-key="1">1</button><button class="key" data-key="2">2</button><button class="key" data-key="3">3</button><button class="key op" data-key="-">−</button><button class="key op" data-key=".">.</button><button class="key" data-key="0">0</button><button class="key eq" data-key="=">=</button><button class="key op" data-key="+">+</button></section><footer class="foot" id="status">Live locally · tap = to sync this shared widget</footer></main><script>
(()=>{'use strict';const $=id=>document.getElementById(id),exprNode=$('expr'),valueNode=$('value'),statusNode=$('status');let expression='',dirty=false,busy=false;const tw=window.TelegramWidget;
function calculate(s){let i=0;const ws=()=>{while(/\s/.test(s[i]||'')&&i<s.length)i++};function atom(){ws();if(s[i]==='+'||s[i]==='-'){const sign=s[i++],v=atom();return sign==='-'?-v:v}if(s[i]==='('){i++;const v=sum();ws();if(s[i++]!==')')throw Error('Close the parentheses');return v}const m=s.slice(i).match(/^(?:\d+(?:\.\d*)?|\.\d+)/);if(!m)throw Error('Complete the expression');i+=m[0].length;return Number(m[0])}function product(){let v=atom();for(;;){ws();const op=s[i];if(op!=='*'&&op!=='/')break;i++;const r=atom();if(op==='/'&&r===0)throw Error('Cannot divide by zero');v=op==='*'?v*r:v/r}return v}function sum(){let v=product();for(;;){ws();const op=s[i];if(op!=='+'&&op!=='-')break;i++;const r=product();v=op==='+'?v+r:v-r}return v}if(!s.trim())return 0;const v=sum();ws();if(i!==s.length||!Number.isFinite(v)||Math.abs(v)>1e15)throw Error('Invalid or out-of-range result');return Number(v.toPrecision(12))}
function display(){exprNode.textContent=expression;try{const v=calculate(expression);valueNode.textContent=String(v);return v}catch(e){valueNode.textContent=e.message==='Cannot divide by zero'?'Error':'…';return null}}
function applyState(s){if(!s||typeof s!=='object')return;if(typeof s.expression==='string'&&typeof s.result==='string'){expression=s.expression;exprNode.textContent=expression;valueNode.textContent=s.result;dirty=false}}
function publicState(){if(!tw||typeof tw.publicData!=='string')return;try{applyState(JSON.parse(tw.publicData))}catch(_){}}
async function commit(){const v=display();if(v===null)return;if(!tw||typeof tw.request!=='function'||tw.canQuery===false){statusNode.textContent='Calculated here · this Telegram client cannot sync shared state';return}if(busy)return;busy=true;dirty=false;statusNode.textContent='Updating shared calculator…';try{const answer=await tw.request('c:'+expression);if(answer&&typeof answer.result==='string'){const state=JSON.parse(answer.result);if(state.ok){applyState(state);statusNode.textContent='Shared result updated';}else statusNode.textContent=state.error||'Could not calculate';}else statusNode.textContent='Calculated locally'}catch(_){statusNode.textContent='Calculated locally · shared update unavailable'}finally{busy=false}}
$('keys').addEventListener('click',e=>{const b=e.target.closest('button[data-key]');if(!b)return;const k=b.dataset.key;if(k==='C'){expression='';dirty=true;display();commit();return}if(k==='⌫'){expression=expression.slice(0,-1);dirty=true;display();return}if(k==='='){commit();return}if(expression.length>=50)return;expression+=k;dirty=true;display();statusNode.textContent='Live locally · tap = to sync this shared widget'});
if(tw){try{tw.ready();if(typeof tw.watchPublicData==='function')tw.watchPublicData();if(typeof tw.onEvent==='function')tw.onEvent('publicDataChanged',()=>{if(!dirty)publicState()});publicState()}catch(_){}}
})();
</script></body></html>
