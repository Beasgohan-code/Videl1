name: Frontend platform

on:
  pull_request:
    paths:
      - 'frontend-platform/**'
      - 'VidelBot/tests/browser/astro-public-build.test.cjs'
      - 'VidelBot/tests/browser/package*.json'
      - '.github/workflows/frontend-platform.yml'
  push:
    paths:
      - 'frontend-platform/**'
      - 'VidelBot/tests/browser/astro-public-build.test.cjs'
      - 'VidelBot/tests/browser/package*.json'
      - '.github/workflows/frontend-platform.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Frontend build, audit and static site browser checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ASTRO_TELEMETRY_DISABLED: '1'
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'
          cache: npm
          cache-dependency-path: |
            frontend-platform/package-lock.json
            VidelBot/tests/browser/package-lock.json
      - name: Install locked frontend dependencies
        working-directory: frontend-platform
        run: npm ci
      - name: Audit frontend dependencies
        working-directory: frontend-platform
        run: npm audit --audit-level=high
      - name: Typecheck and build Astro and Next
        working-directory: frontend-platform
        run: |
          npm run typecheck
          npm run build
      - name: Install locked browser test dependencies
        working-directory: VidelBot/tests/browser
        run: |
          npm ci
          npx playwright-core install --with-deps chromium
      - name: Test built static site with Chromium
        run: |
          set -eu
          python3 -m http.server 4321 --bind 127.0.0.1 --directory frontend-platform/apps/site/dist > /tmp/videl-astro-test.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          curl --fail --silent --retry 10 --retry-connrefused --retry-delay 1 http://127.0.0.1:4321/ > /dev/null
          cd VidelBot/tests/browser
          export CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          npm run test:astro-build
