name: Videl1 CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Syntax, Security, Config & Pytest (Python 3.11)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install pinned test-only FFmpeg and ffprobe
        timeout-minutes: 5
        run: |
          python -m pip install --disable-pip-version-check --no-deps --require-hashes --only-binary=:all: \
            --target "$RUNNER_TEMP/ci-media" -r scripts/ci/media-requirements.txt
          media_bin="$RUNNER_TEMP/ci-media/ffmpeg/binaries"
          test -x "$media_bin/ffmpeg"
          test -x "$media_bin/ffprobe"
          "$media_bin/ffmpeg" -version
          "$media_bin/ffprobe" -version
          echo "$media_bin" >> "$GITHUB_PATH"

      - name: Check dependency & deployment configuration consistency
        run: |
          cmp -s requirements.txt VidelBot/requirements.txt
          test -f Dockerfile
          test -f .dockerignore
          test ! -e VidelBot/Dockerfile
          test ! -e VidelBot/.dockerignore
          python -c '
          import json, pathlib, yaml
          json.loads(pathlib.Path("app.json").read_text())
          for fn in ("docker-compose.yml", "render.yaml", "heroku.yml"):
              assert isinstance(yaml.safe_load(pathlib.Path(fn).read_text()), dict), fn
          print("Deploy manifests valid")
          ' || true

      - name: Install Python dependencies (preserving WzGram over Kurigram)
        run: |
          python -m pip install --upgrade pip
          pip install -r VidelBot/requirements.txt -r VidelBot/requirements-dev.txt
          pip uninstall -y kurigram || true
          pip install --no-deps --force-reinstall wzgram==3.1.6

      - name: Verify deployment manifests (YAML & JSON)
        run: |
          python -c '
          import json, pathlib, yaml
          json.loads(pathlib.Path("app.json").read_text())
          for fn in ("docker-compose.yml", "render.yaml", "heroku.yml"):
              assert isinstance(yaml.safe_load(pathlib.Path(fn).read_text()), dict), fn
          print("All deployment manifests validated")
          '

      - name: Compile Python bytecode & verify runtime stack imports
        run: |
          python -m compileall -q VidelBot
          python -c '
          import sys
          sys.path.insert(0, "VidelBot")
          import os
          os.environ.setdefault("API_ID", "1")
          os.environ.setdefault("API_HASH", "x")
          os.environ.setdefault("BOT_TOKEN", "123456:TEST")
          os.environ.setdefault("DB_URI", "mongodb://localhost:27017")
          os.environ.setdefault("OWNER_ID", "1")
          import client
          st = client.runtime_stack()
          assert (
              st["engine"] == "WzGram"
              and st["rich_available"] is True
              and bool(st["richgram"])
              and st.get("botapi_engine") == "aiogram"
          ), st
          print("Runtime stack OK:", st)
          '

      - name: Static lint & security sanity scan
        run: |
          python -c '
          import ast, pathlib, re
          root = pathlib.Path("VidelBot")
          sources = [p for p in root.rglob("*.py") if "__pycache__" not in p.parts and "tests" not in p.parts]
          for p in sources:
              text = p.read_text(encoding="utf-8")
              tree = ast.parse(text, filename=str(p))
              for node in ast.walk(tree):
                  if isinstance(node, ast.ExceptHandler) and node.type is None:
                      raise SystemExit(f"Bare except in {p}:{node.lineno}")
                  if isinstance(node, ast.Call):
                      fn = ast.unparse(node.func)
                      if fn in ("yaml.load", "pickle.loads", "pickle.load"):
                          raise SystemExit(f"Unsafe deserializer {fn} in {p}:{node.lineno}")
          sample = (root / "config.env.sample").read_text(encoding="utf-8")
          assert not re.search(r"\b\d{8,12}:[A-Za-z0-9_-]{30,}\b", sample), "Token-like secret in config.env.sample"
          print(f"Static security scan passed across {len(sources)} modules")
          '

      - name: Test clone controller migration inventory
        run: python -m unittest scripts.tests.test_audit_clone_controller -v

      - name: Run full pytest suite
        working-directory: VidelBot
        run: python -m pytest tests -q

      - name: Set up Node.js for Studio interaction tests
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.4'

      - name: Test Telegram sign-in interface (synthetic JSDOM)
        run: |
          npm ci --prefix VidelBot/tests/ui --ignore-scripts --no-audit --no-fund
          npm test --prefix VidelBot/tests/ui

      - name: Test Next File Store, analytics and inbox with local backend and mock Mongo
        timeout-minutes: 8
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          DOWNLOAD_DIR: ${{ runner.temp }}/file-contract-storage
          VIDEL_BACKEND_ORIGIN: http://127.0.0.1:8088
        run: |
          set -eu
          npm ci --prefix frontend-platform --no-audit --no-fund
          npm ci --prefix VidelBot/tests/browser --no-audit --no-fund
          (cd VidelBot/tests/browser && npx playwright-core install --with-deps chromium)
          python VidelBot/tests/browser/telegram_auth_fixture.py > "$RUNNER_TEMP/file-api.log" 2>&1 &
          api_pid=$!
          node frontend-platform/node_modules/next/dist/bin/next dev frontend-platform/apps/studio --hostname 127.0.0.1 --port 3001 > "$RUNNER_TEMP/file-next.log" 2>&1 &
          next_pid=$!
          trap 'kill "$api_pid" "$next_pid" 2>/dev/null || true' EXIT
          wait_for_url() {
            local url="$1" tries="${2:-36}"
            for _ in $(seq 1 "$tries"); do
              if curl --fail --silent --max-time 10 "$url" > /dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }
          wait_for_url http://127.0.0.1:8088/app
          wait_for_url http://127.0.0.1:3001/next-preview
          # Warm up routes the browser tests navigate to (triggers Turbopack compile)
          for route in settings files notifications bots commands; do
            curl --fail --silent --max-time 30 "http://127.0.0.1:3001/next-preview/$route" > /dev/null 2>&1 || true
          done
          cd VidelBot/tests/browser
          export CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          node next-file-backend.test.cjs

      - name: Test Next workspace drafts with synthetic API
        timeout-minutes: 10
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          VIDEL_BACKEND_ORIGIN: http://127.0.0.1:8084
          NEXT_PREVIEW_TEST_URL: http://localhost:3002/next-preview
        run: |
          set -eu
          python VidelBot/tests/browser/next_preview_fixture.py > "$RUNNER_TEMP/studio-fixture.log" 2>&1 &
          api_pid=$!
          node frontend-platform/node_modules/next/dist/bin/next dev frontend-platform/apps/studio --hostname 127.0.0.1 --port 3002 > "$RUNNER_TEMP/studio-next.log" 2>&1 &
          next_pid=$!
          trap 'kill "$api_pid" "$next_pid" 2>/dev/null || true' EXIT
          wait_for_url() {
            local url="$1" tries="${2:-36}"
            for _ in $(seq 1 "$tries"); do
              if curl --fail --silent --max-time 10 "$url" > /dev/null 2>&1; then
                return 0
              fi
              sleep 5
            done
            echo "Timed out waiting for $url" >&2
            return 1
          }
          wait_for_url http://127.0.0.1:8084/app
          wait_for_url http://127.0.0.1:3002/next-preview
          # Warm up routes the browser tests navigate to (triggers Turbopack compile)
          for route in settings files notifications bots commands; do
            curl --fail --silent --max-time 30 "http://127.0.0.1:3002/next-preview/$route" > /dev/null 2>&1 || true
          done
          cd VidelBot/tests/browser
          export CHROMIUM_PATH="$(node -p "require('playwright-core').chromium.executablePath()")"
          run_test() {
            local test_file="$1" attempt
            local log_file="$RUNNER_TEMP/browser-${test_file%.cjs}.log"
            for attempt in 1 2 3; do
              echo "Running $test_file (attempt $attempt)"
              if node "$test_file" > "$log_file" 2>&1; then
                cat "$log_file"
                return 0
              fi
              echo "=== $test_file failed on attempt $attempt; test output follows ===" >&2
              cat "$log_file" >&2 || true
              if [ "$attempt" -eq 3 ]; then
                echo "=== Next server log (last 200 lines) ===" >&2
                tail -n 200 "$RUNNER_TEMP/studio-next.log" >&2 || true
                echo "=== Fixture log (last 200 lines) ===" >&2
                tail -n 200 "$RUNNER_TEMP/studio-fixture.log" >&2 || true
                return 1
              fi
              sleep 5
            done
          }
          run_test next-settings.test.cjs
          run_test next-navigation-safety.test.cjs
          run_test next-file-pagination.test.cjs
          run_test next-file-sampling.test.cjs
          run_test next-notification-filters.test.cjs
          run_test next-notification-safety.test.cjs

      - name: Upload Next browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: next-browser-diagnostics-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/browser-*.log
            ${{ runner.temp }}/studio-next.log
            ${{ runner.temp }}/studio-fixture.log
          if-no-files-found: ignore
          retention-days: 7

  native-tools:
    name: Ubuntu native media & archive tools
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Install and verify native tools
        timeout-minutes: 10
        run: bash scripts/ci/install-native-tools.sh
